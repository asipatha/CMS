<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Bakery CRM</title>
<meta name="theme-color" content="#16204A">
<style>
/* ============================================================
   BAKERY CRM — DESIGN TOKENS
   Theme: "Ledger" — a fintech-dashboard visual language
   (deep navy hero cards, mint action colour, soft lavender-white
   light surface, donut/ring charts) adapted to bakery bookkeeping:
   the same navy "balance card" a banking app gives your account,
   this app gives your outstanding-credit total.
   Corner radius is user-adjustable from Settings (Edge Style) —
   every --radius-* token is re-written at runtime by JS, so one
   control reshapes cards, buttons, avatars and sheets together.
   Font: system stack (Roboto on Android) — dependency-free so
   the app truly works offline.
   ============================================================ */
:root{
  --bg:#F3F1FB; --surface:#FFFFFF; --surface-alt:#EDEAF9;
  --primary:#1B2A4A; --primary-container:#E4E9FB; --on-primary:#FFFFFF;
  --accent:#2FD695; --accent-ink:#08301F;
  --success:#2FD695; --success-container:#DEFAF0;
  --danger:#E1495F; --danger-container:#FCE1E5;
  --warn:#F0A93B; --warn-container:#FBEAD0;
  --text:#171B2B; --text-muted:#8B8FA6; --border:#E6E3F4;
  --shadow:0 1px 2px rgba(23,27,43,.06), 0 6px 20px rgba(23,27,43,.07);
  --radius-s:10px; --radius-m:16px; --radius-l:24px; --radius-xl:28px;
  --nav-h:64px; --topbar-h:60px;
  color-scheme: light;
}
html.dark{
  --bg:#0D1016; --surface:#171B24; --surface-alt:#1E232E;
  --primary:#4C7DFF; --primary-container:#1B2740; --on-primary:#FFFFFF;
  --accent:#2FD695; --accent-ink:#06231A;
  --success:#3FE0A2; --success-container:#123326;
  --danger:#FF7080; --danger-container:#3A1B22;
  --warn:#F0B25A; --warn-container:#332812;
  --text:#F4F5FA; --text-muted:#868CA3; --border:#262B38;
  --shadow:0 1px 2px rgba(0,0,0,.35), 0 8px 24px rgba(0,0,0,.35);
  color-scheme: dark;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:Roboto,"Noto Sans Sinhala",system-ui,-apple-system,"Segoe UI",sans-serif;
  overscroll-behavior-y:none; -webkit-font-smoothing:antialiased;
  transition:background .25s ease,color .25s ease;
}
#app{max-width:520px; margin:0 auto; min-height:100vh; position:relative; background:var(--bg); display:flex; flex-direction:column;}
button{font-family:inherit;}
.hidden{display:none !important;}
a{color:inherit;text-decoration:none;}
input,select,textarea{font-family:inherit;}

/* ---------- Top App Bar ---------- */
.topbar{
  position:sticky; top:0; z-index:20; height:var(--topbar-h);
  display:flex; align-items:center; gap:8px; padding:0 12px;
  background:var(--surface); border-bottom:1px solid var(--border);
}
.topbar h1{font-size:19px; font-weight:700; margin:0; flex:1; letter-spacing:.1px;}
.icon-btn{
  width:40px;height:40px;border:none;background:transparent;border-radius:50%;
  display:flex;align-items:center;justify-content:center;color:var(--text);
  cursor:pointer; transition:background .15s;
}
.icon-btn:active{background:var(--surface-alt);}
.icon-btn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.icon-btn.filled svg{fill:currentColor;stroke:none;}

/* ---------- Search bar ---------- */
.searchwrap{padding:8px 12px; background:var(--surface); border-bottom:1px solid var(--border);}
.searchbar{
  display:flex;align-items:center;gap:8px;background:var(--surface-alt);
  border-radius:var(--radius-l); padding:9px 14px;
}
.searchbar input{flex:1;border:none;background:transparent;color:var(--text);font-size:15px;outline:none;}
.searchbar svg{width:18px;height:18px;stroke:var(--text-muted);fill:none;stroke-width:2;flex-shrink:0;}
.suggestbox{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-m); margin-top:6px; overflow:hidden; box-shadow:var(--shadow);}
.suggestbox .sitem{padding:10px 14px; font-size:14px; border-bottom:1px solid var(--border); cursor:pointer;}
.suggestbox .sitem:last-child{border-bottom:none;}
.suggestbox .sitem b{color:var(--primary);}

/* ---------- Chips ---------- */
.chiprow{display:flex; gap:8px; padding:10px 12px; overflow-x:auto; background:var(--surface); border-bottom:1px solid var(--border); scrollbar-width:none;}
.chiprow::-webkit-scrollbar{display:none;}
.chip{
  flex-shrink:0; padding:7px 14px; border-radius:20px; font-size:13px; font-weight:600;
  background:var(--surface-alt); color:var(--text-muted); border:1px solid var(--border); cursor:pointer;
  white-space:nowrap; transition:.15s;
}
.chip.active{background:var(--primary); color:var(--on-primary); border-color:var(--primary);}

/* ---------- Customer list ---------- */
.list{flex:1; overflow-y:auto; padding-bottom:calc(var(--nav-h) + 90px); -webkit-overflow-scrolling:touch;}
.pulltab{
  display:flex; align-items:center; justify-content:center; gap:4px; margin:0 auto; width:fit-content;
  font-size:10px; font-weight:600; color:var(--text-muted); background:var(--surface-alt); border:1px solid var(--border);
  border-radius:20px; height:0; padding:0 10px; opacity:0; overflow:hidden;
  transition:height .18s ease, opacity .18s ease, padding .18s ease;
}
.pulltab.show{height:20px; opacity:1; padding:3px 10px; margin-bottom:4px;}
.pulltab svg{width:10px;height:10px;stroke-width:2.5;flex-shrink:0;}
.spinner{width:10px;height:10px;border:1.5px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

.swipewrap{position:relative; overflow:hidden; border-bottom:1px solid var(--border);}
.swipe-actions{position:absolute; top:0; right:0; height:100%; display:flex;}
.swipe-actions button{width:64px;border:none;color:#fff;font-size:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;}
.swipe-call{background:var(--success);}
.swipe-del{background:var(--danger);}
.swipe-actions svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2;}

.ccard{
  display:flex; align-items:center; gap:12px; padding:12px 14px; background:var(--surface);
  cursor:pointer; position:relative; transition:transform .2s; touch-action:pan-y;
}
.avatar-ring{
  width:52px;height:52px;border-radius:50%;flex-shrink:0;padding:3px;
  display:flex;align-items:center;justify-content:center;
}
.avatar{
  width:100%;height:100%;border-radius:50%;background:var(--primary-container);color:var(--accent-ink);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;overflow:hidden;
}
.avatar img{width:100%;height:100%;object-fit:cover;}
.ccard-body{flex:1; min-width:0;}
.ccard-row1{display:flex;align-items:center;gap:6px;}
.ccard-name{font-weight:700;font-size:15.5px; white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.star-btn{margin-left:auto;flex-shrink:0;background:none;border:none;padding:4px;}
.star-btn svg{width:19px;height:19px;stroke:var(--warn);fill:none;stroke-width:1.8;}
.star-btn.on svg{fill:var(--warn);}
.ccard-shop{font-size:12.5px;color:var(--text-muted); white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ccard-row3{display:flex;align-items:center;justify-content:space-between;margin-top:3px;}
.ccard-meta{font-size:12px;color:var(--text-muted); display:flex; align-items:center; gap:4px;}
.dot{width:6px;height:6px;border-radius:50%;background:var(--success);flex-shrink:0;}
.dot.inactive{background:var(--text-muted);}
.balance-pill{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:10px;}
.balance-pill.due{background:var(--danger-container);color:var(--danger);}
.balance-pill.ok{background:var(--success-container);color:var(--success);}
.quickbtns{display:flex;gap:6px;flex-shrink:0;}
.qbtn{width:36px;height:36px;border-radius:50%;border:none;display:flex;align-items:center;justify-content:center;}
.qbtn svg{width:17px;height:17px;stroke:#fff;fill:none;stroke-width:2.1;}
.qbtn.call{background:var(--primary);}
.qbtn.wa{background:var(--success);}
.empty{padding:60px 30px;text-align:center;color:var(--text-muted);}
.empty svg{width:52px;height:52px;stroke:var(--border);fill:none;stroke-width:1.5;margin-bottom:12px;}
.pagerow{display:flex;justify-content:center;gap:6px;padding:14px;}
.pagerow button{width:32px;height:32px;border-radius:50%;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:13px;}
.pagerow button.on{background:var(--primary);color:var(--on-primary);border-color:var(--primary);}

/* ---------- Hero balance card (fintech "Ledger" signature element) ---------- */
.herocard{
  margin:14px; padding:20px; border-radius:var(--radius-xl);
  background:linear-gradient(135deg,var(--primary) 0%, color-mix(in srgb, var(--primary) 78%, #000 10%) 100%);
  color:#fff; position:relative; overflow:hidden; box-shadow:var(--shadow);
}
.herocard::before{content:'';position:absolute;top:-40px;right:-30px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.06);}
.herocard::after{content:'';position:absolute;bottom:-50px;left:-20px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.05);}
.herocard .hc-lbl{font-size:12px;opacity:.75;position:relative;}
.herocard .hc-amt{font-size:28px;font-weight:800;margin:4px 0 14px;position:relative;}
.herocard .hc-stats{display:flex;gap:10px;position:relative;}
.herocard .hc-stat{flex:1;background:rgba(255,255,255,.12);border-radius:var(--radius-s);padding:8px 10px;backdrop-filter:blur(2px);}
.herocard .hc-stat .n{font-size:14px;font-weight:700;}
.herocard .hc-stat .l{font-size:10.5px;opacity:.8;margin-top:1px;}
.quickstats{display:flex;gap:10px;padding:0 14px 4px;}
.qstat{flex:1;background:var(--surface);border-radius:var(--radius-m);padding:12px 10px;box-shadow:var(--shadow);text-align:center;}
.qstat .qi{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;margin:0 auto 6px;}
.qstat .qi svg{width:16px;height:16px;stroke:#fff;fill:none;stroke-width:2.2;}
.qstat .qn{font-size:13px;font-weight:800;}
.qstat .ql{font-size:10px;color:var(--text-muted);margin-top:1px;}

/* ---------- Donut chart (reports) ---------- */
.donutwrap{display:flex;align-items:center;gap:18px;}
.donut{width:120px;height:120px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;position:relative;}
.donut .hole{width:72px;height:72px;border-radius:50%;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;}
.donut .hole b{font-size:13px;}
.donut .hole span{font-size:9.5px;color:var(--text-muted);}
.donut-legend{flex:1;}
.dl-row{display:flex;align-items:center;gap:8px;font-size:12.5px;margin-bottom:8px;}
.dl-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.dl-row .dl-val{margin-left:auto;font-weight:700;}

/* ---------- FAB (kept for quick-add inside profile / list contexts) ---------- */
.fab{
  position:fixed; right:calc(50% - 260px + 20px); bottom:calc(var(--nav-h) + 18px); z-index:30;
  width:0;height:0;overflow:hidden;border:none;background:transparent;
}
@media (min-width:520px){ .fab{right:calc(50vw - 260px + 20px);} }

/* ---------- Bottom nav (raised centre action button, fintech-style) ---------- */
.bottomnav{
  position:sticky; bottom:0; z-index:25; height:var(--nav-h); background:var(--surface);
  border-top:1px solid var(--border); display:flex; padding-bottom:env(safe-area-inset-bottom);
}
.navcenter{
  flex:1; display:flex; align-items:center; justify-content:center; position:relative;
}
.navcenter button{
  width:52px;height:52px;border-radius:50%;border:4px solid var(--bg);background:var(--accent);color:var(--accent-ink);
  display:flex;align-items:center;justify-content:center;position:absolute;top:-22px;box-shadow:0 4px 12px rgba(0,0,0,.25);
}
.navcenter svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2.4;}
/* ---------- Edge-style (corner radius) picker ---------- */
.edgeseg{display:flex;gap:8px;padding:2px 0;}
.edgeopt{flex:1;border:1.5px solid var(--border);background:var(--surface-alt);padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:10.5px;font-weight:600;color:var(--text-muted);}
.edgeopt .swatch{width:28px;height:28px;background:var(--primary);}
.edgeopt.on{border-color:var(--primary);color:var(--primary);background:var(--primary-container);}
.navbtn{
  flex:1;border:none;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;color:var(--text-muted);font-size:10.5px;font-weight:600;position:relative;
}
.navbtn.active{color:var(--primary);}
.navbtn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;}
.navbtn .badge{position:absolute;top:2px;right:calc(50% - 20px);background:var(--danger);color:#fff;font-size:9px;font-weight:700;border-radius:8px;min-width:15px;height:15px;display:flex;align-items:center;justify-content:center;padding:0 3px;}

/* ---------- Screens / generic ---------- */
.screen{display:flex;flex-direction:column;min-height:100vh;}
.scroll{flex:1;overflow-y:auto;padding-bottom:calc(var(--nav-h) + 30px);}
.section{padding:16px;}
.section h3{font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--text-muted);margin:0 0 10px;}
.card{background:var(--surface);border-radius:var(--radius-m);padding:16px;box-shadow:var(--shadow);margin-bottom:12px;}
.row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);font-size:14px;}
.row:last-child{border-bottom:none;}
.row .k{color:var(--text-muted);}
.row .v{font-weight:600;text-align:right;max-width:60%;}

/* ---------- Profile header ---------- */
.pheader{background:linear-gradient(180deg,var(--primary-container),var(--bg) 85%);padding:24px 16px 18px;text-align:center;}
.pheader .avatar-ring{width:96px;height:96px;margin:0 auto 10px;}
.pheader .avatar{font-size:34px;}
.pheader h2{margin:0;font-size:20px;}
.pheader p{margin:2px 0 0;color:var(--text-muted);font-size:13.5px;}
.actionrow{display:flex;gap:10px;padding:14px 16px 4px;flex-wrap:wrap;}
.actbtn{
  flex:1;min-width:70px;border:none;border-radius:var(--radius-s);padding:11px 6px;display:flex;flex-direction:column;
  align-items:center;gap:4px;font-size:11px;font-weight:600;color:#fff;
}
.actbtn svg{width:19px;height:19px;stroke:#fff;fill:none;stroke-width:2;}
.actbtn.call{background:var(--primary);}
.actbtn.wa{background:var(--success);}
.actbtn.map{background:var(--warn);}
.actbtn.edit{background:var(--surface-alt);color:var(--text);}
.actbtn.edit svg{stroke:var(--text);}
.actbtn.del{background:var(--danger-container);color:var(--danger);}
.actbtn.del svg{stroke:var(--danger);}

/* ---------- Tabs ---------- */
.tabbar{display:flex;overflow-x:auto;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:var(--topbar-h);z-index:15;scrollbar-width:none;}
.tabbar::-webkit-scrollbar{display:none;}
.tabbtn{flex-shrink:0;padding:13px 15px;font-size:13.5px;font-weight:600;color:var(--text-muted);border:none;background:none;border-bottom:3px solid transparent;white-space:nowrap;}
.tabbtn.active{color:var(--primary);border-color:var(--primary);}
.tabpanel{display:none;}
.tabpanel.active{display:block;}

/* ---------- Order / payment items ---------- */
.oitem{background:var(--surface);border-radius:var(--radius-m);padding:14px;margin-bottom:10px;box-shadow:var(--shadow);}
.oitem-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px;}
.oitem-date{font-size:12px;color:var(--text-muted);}
.status-badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:8px;}
.status-pending{background:var(--warn-container);color:var(--warn);}
.status-preparing{background:var(--primary-container);color:var(--primary);}
.status-delivered{background:var(--success-container);color:var(--success);}
.status-cancelled{background:var(--danger-container);color:var(--danger);}
.oitem-products{font-size:13px;color:var(--text-muted);margin:6px 0;}
.oitem-total{font-weight:700;font-size:15px;}
.oitem-actions{display:flex;gap:8px;margin-top:8px;}
.miniBtn{border:1px solid var(--border);background:var(--surface-alt);border-radius:8px;padding:6px 12px;font-size:12px;font-weight:600;color:var(--text);}
.miniBtn.danger{color:var(--danger);border-color:var(--danger-container);}

/* ---------- Forms ---------- */
.field{margin-bottom:14px;}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--text-muted);margin-bottom:6px;}
.field input,.field select,.field textarea{
  width:100%;padding:11px 13px;border-radius:var(--radius-s);border:1px solid var(--border);
  background:var(--surface);color:var(--text);font-size:14.5px;outline:none;
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--primary);}
.field textarea{resize:vertical;min-height:64px;}
.photoUpload{display:flex;align-items:center;gap:14px;margin-bottom:16px;}
.photoUpload .avatar{width:66px;height:66px;font-size:22px;}
.uploadBtn{border:1px dashed var(--border);background:var(--surface-alt);padding:9px 14px;border-radius:var(--radius-s);font-size:12.5px;font-weight:600;color:var(--primary);}
.productRow{display:flex;gap:8px;margin-bottom:8px;align-items:center;}
.productRow input{flex:1;}
.productRow input.qty,.productRow input.price{width:70px;flex:none;}
.rmRow{width:34px;height:34px;flex-shrink:0;border:none;background:var(--danger-container);color:var(--danger);border-radius:8px;font-size:16px;}
.addRowBtn{width:100%;border:1px dashed var(--border);background:transparent;color:var(--primary);padding:10px;border-radius:var(--radius-s);font-weight:600;font-size:13.5px;margin-bottom:6px;}
.formfoot{display:flex;gap:10px;padding:16px;position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--border);}
.btn{flex:1;padding:13px;border-radius:var(--radius-s);border:none;font-weight:700;font-size:14.5px;}
.btn.primary{background:var(--primary);color:var(--on-primary);}
.btn.ghost{background:var(--surface-alt);color:var(--text);}
.formHeader{display:flex;align-items:center;gap:8px;padding:0 12px;height:var(--topbar-h);background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20;}
.formHeader h2{font-size:17px;margin:0;flex:1;}
.totalBox{background:var(--primary-container);border-radius:var(--radius-m);padding:14px;margin:10px 0;text-align:center;}
.totalBox .amt{font-size:24px;font-weight:800;color:var(--accent-ink);}

/* ---------- Reports ---------- */
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.statcard{background:var(--surface);border-radius:var(--radius-m);padding:14px;box-shadow:var(--shadow);}
.statcard .num{font-size:20px;font-weight:800;}
.statcard .lbl{font-size:11.5px;color:var(--text-muted);margin-top:2px;}
.barrow{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.barrow .name{width:88px;font-size:12px;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.barrow .track{flex:1;height:10px;background:var(--surface-alt);border-radius:6px;overflow:hidden;}
.barrow .fill{height:100%;background:var(--primary);border-radius:6px;}
.barrow .val{width:56px;text-align:right;font-size:12px;font-weight:700;flex-shrink:0;}

/* ---------- Settings ---------- */
.settingItem{display:flex;align-items:center;gap:12px;padding:14px 4px;border-bottom:1px solid var(--border);}
.settingItem:last-child{border-bottom:none;}
.settingItem .si-icon{width:38px;height:38px;border-radius:10px;background:var(--surface-alt);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.settingItem .si-icon svg{width:19px;height:19px;stroke:var(--primary);fill:none;stroke-width:2;}
.settingItem .si-txt{flex:1;}
.settingItem .si-txt .t1{font-size:14.5px;font-weight:600;}
.settingItem .si-txt .t2{font-size:12px;color:var(--text-muted);}
.switch{width:44px;height:26px;border-radius:14px;background:var(--border);position:relative;border:none;flex-shrink:0;}
.switch::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s;}
.switch.on{background:var(--primary);}
.switch.on::after{left:21px;}
.seg{display:flex;background:var(--surface-alt);border-radius:var(--radius-s);padding:3px;gap:3px;}
.seg button{flex:1;border:none;background:none;padding:8px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--text-muted);}
.seg button.on{background:var(--surface);color:var(--primary);box-shadow:0 1px 3px rgba(0,0,0,.1);}

/* ---------- Modal / dialog / toast ---------- */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:80;display:flex;align-items:center;justify-content:center;padding:24px;}
.dialog{background:var(--surface);border-radius:var(--radius-m);padding:20px;max-width:340px;width:100%;box-shadow:var(--shadow);}
.dialog h3{margin:0 0 8px;font-size:16.5px;}
.dialog p{margin:0 0 18px;font-size:14px;color:var(--text-muted);}
.dialog .drow{display:flex;gap:10px;}
.toast{
  position:fixed;left:50%;bottom:calc(var(--nav-h) + 20px);transform:translateX(-50%);
  background:var(--text);color:var(--bg);padding:11px 18px;border-radius:24px;font-size:13.5px;font-weight:600;
  z-index:100;box-shadow:var(--shadow); opacity:0; transition:opacity .25s, bottom .25s; pointer-events:none;
}
.toast.show{opacity:1;bottom:calc(var(--nav-h) + 34px);}

/* ---------- Login ---------- */
.loginwrap{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:32px;background:linear-gradient(160deg,var(--primary-container),var(--bg) 60%);}
.logo{width:78px;height:78px;border-radius:24px;background:var(--primary);color:var(--on-primary);display:flex;align-items:center;justify-content:center;margin:0 auto 20px;font-size:34px;font-weight:800;box-shadow:var(--shadow);}
.loginwrap h1{text-align:center;font-size:22px;margin:0 0 4px;}
.loginwrap p{text-align:center;color:var(--text-muted);font-size:13.5px;margin:0 0 26px;}
.notif-drawer{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:70;display:flex;justify-content:flex-end;}
.notif-panel{width:88%;max-width:360px;background:var(--surface);height:100%;overflow-y:auto;padding:16px;box-shadow:var(--shadow);}
.notifCard{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);}
.notifCard .ni{width:36px;height:36px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.notifCard .ni svg{width:17px;height:17px;stroke:#fff;fill:none;stroke-width:2;}
.notifCard .nt1{font-size:13.5px;font-weight:600;}
.notifCard .nt2{font-size:12px;color:var(--text-muted);margin-top:2px;}
.langToggle{display:flex;gap:6px;justify-content:center;margin-bottom:18px;}
.langToggle button{padding:6px 14px;border-radius:16px;border:1px solid var(--border);background:var(--surface);font-size:12.5px;font-weight:600;color:var(--text-muted);}
.langToggle button.on{background:var(--primary);color:var(--on-primary);border-color:var(--primary);}

function loadDB(){

  }catch(e){}

let DB=loadDB();
function saveDB(){
  localStorage.setItem(DB_KEY,JSON.stringify(DB));

function autoBackup(){
  try{
    let snaps=JSON.parse(localStorage.getItem(BACKUP_KEY)||'[]');
    snaps.unshift({t:Date.now(),data:DB});
    snaps=snaps.slice(0,3);
    localStorage.setItem(BACKUP_KEY,JSON.stringify(snaps));

}

   4. UTILS
   ============================================================ */
function fmtMoney(n){ return 'Rs. '+(Number(n)||0).toLocaleString('en-LK',{maximumFractionDigits:2}); }
function fmtDate(ts){ if(!ts) return t('never'); const d=new Date(ts); return d.toLocaleDateString(LANG==='si'?'si-LK':'en-GB',{day:'2-digit',month:'short',year:'numeric'}); }
function dateInputVal(ts){ const d=ts?new Date(ts):new Date(); return d.toISOString().slice(0,10); }
function parseDateInput(v){ return v? new Date(v+'T00:00:00').getTime(): Date.now(); }
function initials(name){ return (name||'?').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase(); }
function orderTotal(o){ const sub=(o.products||[]).reduce((s,p)=>s+ (Number(p.qty)||0)*(Number(p.price)||0),0); return Math.max(0, sub-(Number(o.discount)||0)); }
function custOrders(id){ return DB.orders.filter(o=>o.customerId===id).sort((a,b)=>b.orderDate-a.orderDate); }
function custPayments(id){ return DB.payments.filter(p=>p.customerId===id).sort((a,b)=>b.date-a.date); }
function custTotalCredit(id){ return custOrders(id).reduce((s,o)=>s+orderTotal(o),0); }
function custTotalPaid(id){ return custPayments(id).reduce((s,p)=>s+(Number(p.amount)||0),0); }
function custBalance(id){ return custTotalCredit(id)-custTotalPaid(id); }
function custLastOrderDate(id){ const os=custOrders(id); return os.length? os[0].orderDate: null; }
function routeName(id){ const r=DB.routes.find(r=>r.id===id); return r? r.name : ''; }
/* ---- Edge Style (manual corner-radius control, applies everywhere) ---- */
const RADIUS_PRESETS = {
  sharp:{s:'4px', m:'8px', l:'12px', xl:'14px'},
  soft:{s:'10px', m:'16px', l:'24px', xl:'28px'},
  round:{s:'14px', m:'22px', l:'32px', xl:'36px'},
  pill:{s:'20px', m:'28px', l:'40px', xl:'44px'},
};
function applyRadiusPreset(name){
  const p=RADIUS_PRESETS[name]||RADIUS_PRESETS.soft;
  const r=document.documentElement.style;
  r.setProperty('--radius-s',p.s); r.setProperty('--radius-m',p.m); r.setProperty('--radius-l',p.l); r.setProperty('--radius-xl',p.xl);
  localStorage.setItem('crm_radius',name);
}
function toast(msg){
  let el=document.getElementById('toastEl');
  if(!el){ el=document.createElement('div'); el.id='toastEl'; el.className='toast'; document.body.appendChild(el); }
  el.textContent=msg; el.classList.add('show');
  clearTimeout(toast._tm); toast._tm=setTimeout(()=>el.classList.remove('show'),2200);
}
function escapeHtml(s){ return (s||'').toString().replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

const S = {

  if(S.screen==='home') html=renderHome();

  const right=[{k:'alerts',icon:'bell',label:t('alerts'),badge:notifList().length},{k:'settings',icon:'gear',label:t('settings')}];

      ${i.badge? `<span class="badge">${i.badge}</span>`:''}

  return `<div class="bottomnav">

    ${right.map(navBtn).join('')}

function bindNav(){
  root.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{
    if(b.dataset.nav==='alerts'){ openNotifDrawer(); return; }
    go(b.dataset.nav);

    if(S.screen!=='home') go('home');

  });
}

function filteredCustomers(){
  let list=DB.customers.slice();
  const q=S.search.trim().toLowerCase();
  if(q){
    list=list.filter(c=> [c.name,c.mobile,c.shopName,routeName(c.route)].some(f=>(f||'').toLowerCase().includes(q))
      || DB.orders.some(o=>o.customerId===c.id && (o.products||[]).some(p=>(p.name||'').toLowerCase().includes(q))) );
  }
  if(S.filter==='active') list=list.filter(c=>c.status==='active');
  if(S.filter==='inactive') list=list.filter(c=>c.status==='inactive');
  if(S.filter==='credit') list=list.filter(c=>custBalance(c.id)>0);
  if(S.filter==='paid') list=list.filter(c=>custBalance(c.id)<=0);
  if(S.filter==='favorites') list=list.filter(c=>c.favorite);
  if(S.filter==='route') list.sort((a,b)=>routeName(a.route).localeCompare(routeName(b.route)));
  if(S.sort==='recent') list.sort((a,b)=>(custLastOrderDate(b.id)||0)-(custLastOrderDate(a.id)||0));
  if(S.sort==='name') list.sort((a,b)=>a.name.localeCompare(b.name));
  if(S.sort==='balance') list.sort((a,b)=>custBalance(b.id)-custBalance(a.id));
  return list;
}

  const day=86400000, now=Date.now();

  const activeCount=DB.customers.filter(c=>c.status==='active').length;
  return `
  <div class="screen">
    <div class="topbar">
      <h1>${t('appName')}</h1>
      <button class="icon-btn" id="sortBtn">${icon('sort')}</button>

        <div class="hc-stat"><div class="n">${activeCount}</div><div class="l">${t('active')}</div></div>
        <div class="hc-stat"><div class="n">${DB.customers.length}</div><div class="l">${t('customerCount')}</div></div>
      </div>
    </div>

/* ---- home interactions ---- */
let pullStartY=null, pulling=false;
function bindHomeEvents(){
  const s=document.getElementById('searchInput');
  if(s){ s.oninput=()=>{ S.search=s.value; S.homePage=1; renderSuggestions(); renderListOnly(); }; s.onfocus=renderSuggestions; }
  document.getElementById('sortBtn')?.addEventListener('click',()=>openSortSheet());
  root.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{ S.filter=b.dataset.filter; S.homePage=1; render(); });
  document.getElementById('fabAdd')?.addEventListener('click',()=>openCustomerForm(null));
  root.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{ S.homePage=parseInt(b.dataset.page); renderListOnly(); });
  root.querySelectorAll('[data-open]').forEach(el=>el.addEventListener('click',(e)=>{
    if(e.target.closest('[data-star],[data-call],[data-wa],[data-del]')) return;
    S.activeCustomer=el.dataset.open; S.profileTab='info'; go('profile');
  }));
  root.querySelectorAll('[data-star]').forEach(b=>b.onclick=(e)=>{ e.stopPropagation(); toggleFavorite(b.dataset.star); });
  root.querySelectorAll('[data-call]').forEach(b=>b.onclick=(e)=>{ e.stopPropagation(); callCustomer(b.dataset.call); });
  root.querySelectorAll('[data-wa]').forEach(b=>b.onclick=(e)=>{ e.stopPropagation(); waCustomer(b.dataset.wa); });
  root.querySelectorAll('[data-del]').forEach(b=>b.onclick=(e)=>{ e.stopPropagation(); confirmDeleteCustomer(b.dataset.del); });
  // swipe
  root.querySelectorAll('.swipewrap').forEach(w=>{
    let startX=0,curX=0,card=w.querySelector('.ccard'),open=false;
    card.addEventListener('touchstart',e=>{ startX=e.touches[0].clientX; },{passive:true});
    card.addEventListener('touchmove',e=>{
      curX=e.touches[0].clientX; const dx=curX-startX;
      if(dx<0) card.style.transform=`translateX(${Math.max(dx,-128)}px)`;
    },{passive:true});
    card.addEventListener('touchend',()=>{
      const dx=curX-startX;
      if(dx<-60){ card.style.transform='translateX(-128px)'; open=true; }
      else { card.style.transform='translateX(0)'; open=false; }
    });
  });
  // pull to refresh
  const listArea=document.getElementById('listArea');
  if(listArea){
    listArea.addEventListener('touchstart',e=>{ if(listArea.scrollTop<=0) pullStartY=e.touches[0].clientY; },{passive:true});
    listArea.addEventListener('touchmove',e=>{
      if(pullStartY===null) return;
      const dy=e.touches[0].clientY-pullStartY;
      const tab=document.getElementById('pullTab');
      if(!tab) return;
      if(dy>10){
        pulling=true; tab.classList.add('show');
        tab.innerHTML = (dy>70? `${icon('refresh')}<span>${t('releaseRefresh')}</span>` : `${icon('refresh')}<span>${t('pullRefresh')}</span>`);
      } else { pulling=false; tab.classList.remove('show'); }
    },{passive:true});
    listArea.addEventListener('touchend',()=>{
      const tab=document.getElementById('pullTab');
      if(pulling && tab){
        tab.innerHTML=`<span class="spinner"></span><span>${t('refreshing')}</span>`;
        setTimeout(()=>{ DB=loadDB(); render(); toast(t('saved')); },500);
      } else if(tab){ tab.classList.remove('show'); }
      pullStartY=null; pulling=false;
    });
  }
}
function renderListOnly(){
  const listArea=document.getElementById('listArea'); if(!listArea) return;
  const all=filteredCustomers();
  const totalPages=Math.max(1,Math.ceil(all.length/S.pageSize));
  S.homePage=Math.min(S.homePage,totalPages);
  const pageItems=all.slice((S.homePage-1)*S.pageSize,S.homePage*S.pageSize);
  listArea.innerHTML=`<div class="pulltab" id="pullTab">${icon('refresh')}<span>${t('pullRefresh')}</span></div>
    ${pageItems.length? pageItems.map(renderCustomerCard).join(''): `<div class="empty">${icon('search')}<div>${t('noResults')}</div></div>`}
    ${all.length>S.pageSize? renderPager(totalPages):''}`;
  bindHomeEvents();
}
function renderSuggestions(){
  const area=document.getElementById('suggestArea'); if(!area) return;
  const q=S.search.trim().toLowerCase();
  if(!q){ area.innerHTML=''; return; }
  const matches=DB.customers.filter(c=>(c.name||'').toLowerCase().includes(q)).slice(0,5);
  if(!matches.length){ area.innerHTML=''; return; }
  area.innerHTML=`<div class="suggestbox">${matches.map(c=>`<div class="sitem" data-sugg="${c.id}">${escapeHtml(c.name)} <span style="color:var(--text-muted)">— ${escapeHtml(c.shopName||'')}</span></div>`).join('')}</div>`;
  area.querySelectorAll('[data-sugg]').forEach(el=>el.onclick=()=>{ S.activeCustomer=el.dataset.sugg; S.profileTab='info'; go('profile'); });
}
function toggleFavorite(id){ const c=DB.customers.find(c=>c.id===id); c.favorite=!c.favorite; saveDB(); renderListOnly(); }
function callCustomer(id){ const c=DB.customers.find(c=>c.id===id); if(c) window.location.href='tel:'+c.mobile; }
function waCustomer(id, msg){
  const c=DB.customers.find(c=>c.id===id); if(!c) return;
  const num=(c.whatsapp||c.mobile||'').replace(/\D/g,'');
  const text=encodeURIComponent(msg||`Hello ${c.name}, `);
  window.open(`https://wa.me/${num}?text=${text}`,'_blank');
}
function confirmDeleteCustomer(id){
  showDialog(t('confirmDeleteTitle'), t('confirmDeleteBody'), ()=>{
    DB.customers=DB.customers.filter(c=>c.id!==id);
    DB.orders=DB.orders.filter(o=>o.customerId!==id);
    DB.payments=DB.payments.filter(p=>p.customerId!==id);
    saveDB(); toast(t('deleted'));
    if(S.screen==='profile'&&S.activeCustomer===id) go('home'); else render();
  });
}
function openSortSheet(){
  const opts=[['recent',t('lastOrder')],['name',t('fullName')],['balance',t('outstanding')]];
  showActionSheet(t('sort'), opts.map(([k,l])=>({label:l, active:S.sort===k, onClick:()=>{ S.sort=k; render(); }})));
}

   9. DIALOGS / SHEETS
   ============================================================ */
function showDialog(title, body, onConfirm){
  const ov=document.createElement('div'); ov.className='overlay';
  ov.innerHTML=`<div class="dialog"><h3>${title}</h3><p>${body}</p>
    <div class="drow"><button class="btn ghost" id="dCancel">${t('cancel')}</button><button class="btn primary" id="dOk" style="background:var(--danger)">${t('delete')}</button></div></div>`;
  document.body.appendChild(ov);
  ov.querySelector('#dCancel').onclick=()=>ov.remove();
  ov.querySelector('#dOk').onclick=()=>{ onConfirm(); ov.remove(); };
  ov.addEventListener('click',e=>{ if(e.target===ov) ov.remove(); });
}
function showActionSheet(title, items){
  const ov=document.createElement('div'); ov.className='overlay';
  ov.innerHTML=`<div class="dialog"><h3>${title}</h3>
    ${items.map((it,i)=>`<div class="settingItem" style="cursor:pointer;border-bottom:${i===items.length-1?'none':'1px solid var(--border)'}" data-idx="${i}">
      <div class="si-txt"><div class="t1" style="color:${it.active?'var(--primary)':'var(--text)'}">${it.label}</div></div>
      ${it.active? icon('chevron'):''}
    </div>`).join('')}
    </div>`;
  document.body.appendChild(ov);
  ov.querySelectorAll('[data-idx]').forEach(el=>el.onclick=()=>{ items[el.dataset.idx].onClick(); ov.remove(); });
  ov.addEventListener('click',e=>{ if(e.target===ov) ov.remove(); });
}
function openNotifDrawer(){
  const list=notifList();
  const ov=document.createElement('div'); ov.className='notif-drawer';
  ov.innerHTML=`<div class="notif-panel">
    <div style="display:flex;align-items:center;margin-bottom:14px;"><h2 style="flex:1;margin:0;font-size:17px;">${t('notifications')}</h2><button class="icon-btn" id="closeNotif">${icon('close')}</button></div>
    ${list.length? list.map(n=>`<div class="notifCard"><div class="ni" style="background:${n.color}">${icon(n.icon)}</div><div><div class="nt1">${n.title}</div><div class="nt2">${n.sub}</div></div></div>`).join('')
      : `<div class="empty">${icon('bell')}<div>${t('noNotif')}</div></div>`}
  </div>`;
  document.body.appendChild(ov);
  ov.querySelector('#closeNotif').onclick=()=>ov.remove();
  ov.addEventListener('click',e=>{ if(e.target===ov) ov.remove(); });
}
function notifList(){
  const out=[]; const day=86400000; const now=Date.now();
  DB.customers.forEach(c=>{
    const bal=custBalance(c.id);
    if(bal>0) out.push({title:`${t('paymentDue')}: ${c.name}`, sub:fmtMoney(bal), icon:'call', color:'var(--danger)'});
    const last=custLastOrderDate(c.id);
    if(last && (now-last)>30*day && c.status==='active') out.push({title:`${t('inactiveReminder')}: ${c.name}`, sub:fmtDate(last), icon:'bell', color:'var(--warn)'});
  });
  DB.orders.forEach(o=>{
    if(o.status!=='delivered' && o.status!=='cancelled' && o.deliveryDate && Math.abs(o.deliveryDate-now)<day){
      const c=DB.customers.find(c=>c.id===o.customerId);
      out.push({title:`${t('deliveryReminder')}: ${c?c.name:''}`, sub:fmtDate(o.deliveryDate), icon:'package', color:'var(--primary)'});
    }
  });
  return out.slice(0,20);
}

function tabOrders(c){

function tabProducts(c){
  const orders=custOrders(c.id);

  orders.forEach(o=>(o.products||[]).forEach(p=>{
    if(!map[p.name]) map[p.name]={name:p.name,qty:0,freq:0,last:0};
    map[p.name].qty+=Number(p.qty)||0; map[p.name].freq++; map[p.name].last=Math.max(map[p.name].last,o.orderDate);
  }));
  const arr=Object.values(map).sort((a,b)=>b.freq-a.freq);
  if(!arr.length) return `<div class="empty" style="padding:24px;">${t('noOrders')}</div>`;
  return `<div class="card">${arr.map(p=>`<div class="row"><span class="k">${escapeHtml(p.name)}</span><span class="v">${t('qty')}: ${p.qty} · ${t('frequency')}: ${p.freq} · ${fmtDate(p.last)}</span></div>`).join('')}</div>`;

function tabNotes(c){

function openQrOverlay(id){
  const c=DB.customers.find(c=>c.id===id);
  const ov=document.createElement('div'); ov.className='overlay';
  ov.innerHTML=`<div class="dialog" style="text-align:center;">
    <h3>${t('qrCode')}</h3>
    <div id="qrHolder" style="width:160px;height:160px;margin:0 auto 12px;background:var(--surface-alt);border-radius:12px;display:flex;align-items:center;justify-content:center;">${icon('qr','')}</div>
    <p style="font-family:monospace;font-size:16px;color:var(--text);margin-bottom:4px;">${c.id.toUpperCase()}</p>
    <p style="font-size:12px;">${escapeHtml(c.name)}</p>
    <button class="btn primary" id="qrClose" style="width:100%;margin-top:10px;">${t('cancel')}</button>
  </div>`;
  document.body.appendChild(ov);
  ov.querySelector('#qrClose').onclick=()=>ov.remove();
  ov.addEventListener('click',e=>{ if(e.target===ov) ov.remove(); });
  // progressive enhancement: try to load a QR lib (works when online); safe no-op offline
  if(!window.QRCode){
    const s=document.createElement('script'); s.src='https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js';
    s.onload=()=>renderQr(c.id.toUpperCase()); s.onerror=()=>{};
    document.body.appendChild(s);
  } else renderQr(c.id.toUpperCase());
  function renderQr(text){
    try{
      const holder=document.getElementById('qrHolder'); if(!holder||!window.qrcode) return;
      const qr=qrcode(0,'M'); qr.addData(text); qr.make();
      holder.innerHTML=qr.createSvgTag(4,0);
    }catch(e){}
  }
}
function printInvoice(id){
  const c=DB.customers.find(c=>c.id===id);
  const orders=custOrders(id);
  const w=window.open('','_blank');
  w.document.write(`<html><head><title>Invoice - ${escapeHtml(c.name)}</title>
  <style>body{font-family:Arial,sans-serif;padding:24px;color:#222;} table{width:100%;border-collapse:collapse;margin-top:14px;} td,th{border:1px solid #ddd;padding:8px;font-size:13px;text-align:left;} h2{margin-bottom:0;} .tot{font-weight:bold;font-size:15px;margin-top:10px;text-align:right;}</style>

   ============================================================ */
function renderReportsScreen(){
  const day=86400000, now=Date.now();
  const inRange=(ts,days)=> (now-ts) <= days*day;
  const dailyTotal=DB.orders.filter(o=>inRange(o.orderDate,1)).reduce((s,o)=>s+orderTotal(o),0);
  const weeklyTotal=DB.orders.filter(o=>inRange(o.orderDate,7)).reduce((s,o)=>s+orderTotal(o),0);
  const monthlyTotal=DB.orders.filter(o=>inRange(o.orderDate,30)).reduce((s,o)=>s+orderTotal(o),0);
  const topCustomers=DB.customers.map(c=>({c,total:custTotalCredit(c.id)})).sort((a,b)=>b.total-a.total).slice(0,5);
  const outstandingCustomers=DB.customers.map(c=>({c,bal:custBalance(c.id)})).filter(x=>x.bal>0).sort((a,b)=>b.bal-a.bal).slice(0,5);
  const routePerf={};
  DB.orders.forEach(o=>{ const c=DB.customers.find(c=>c.id===o.customerId); if(!c) return; const r=routeName(c.route)||'—'; routePerf[r]=(routePerf[r]||0)+orderTotal(o); });
  const routeArr=Object.entries(routePerf).sort((a,b)=>b[1]-a[1]);
  const prodMap={}; DB.orders.forEach(o=>(o.products||[]).forEach(p=>{ prodMap[p.name]=(prodMap[p.name]||0)+(Number(p.qty)||0); }));
  const bestProducts=Object.entries(prodMap).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const maxRoute=Math.max(1,...routeArr.map(r=>r[1]));
  const maxProd=Math.max(1,...bestProducts.map(p=>p[1]));
  const grandCredit=DB.customers.reduce((s,c)=>s+custTotalCredit(c.id),0);
  const grandPaid=DB.customers.reduce((s,c)=>s+custTotalPaid(c.id),0);
  const grandOut=Math.max(0,grandCredit-grandPaid);
  const paidPct= grandCredit>0? Math.round((grandPaid/grandCredit)*100): 100;
  return `<div class="screen">
    <div class="topbar"><h1>${t('reportsTitle')}</h1>
      <button class="icon-btn" id="expCsv">${icon('file')}</button>
    </div>
    <div class="scroll section">
      <div class="card donutwrap">
        <div class="donut" style="background:conic-gradient(var(--success) ${paidPct}%, var(--danger) 0)">
          <div class="hole"><b>${paidPct}%</b><span>${t('paid')}</span></div>
        </div>
        <div class="donut-legend">
          <div class="dl-row"><span class="dl-dot" style="background:var(--success)"></span>${t('totalPaid')}<span class="dl-val">${fmtMoney(grandPaid)}</span></div>
          <div class="dl-row"><span class="dl-dot" style="background:var(--danger)"></span>${t('outBalance')}<span class="dl-val">${fmtMoney(grandOut)}</span></div>
        </div>
      </div>
      <div class="statgrid">
        <div class="statcard"><div class="num">${fmtMoney(dailyTotal)}</div><div class="lbl">${t('dailySales')}</div></div>
        <div class="statcard"><div class="num">${fmtMoney(weeklyTotal)}</div><div class="lbl">${t('weeklySales')}</div></div>
        <div class="statcard"><div class="num">${fmtMoney(monthlyTotal)}</div><div class="lbl">${t('monthlySales')}</div></div>
        <div class="statcard"><div class="num">${DB.customers.length}</div><div class="lbl">${t('customerCount')}</div></div>
      </div>
      <h3 style="margin-top:20px;">${t('topCustomers')}</h3>
      <div class="card">${topCustomers.map(x=>`<div class="row"><span class="k">${escapeHtml(x.c.name)}</span><span class="v">${fmtMoney(x.total)}</span></div>`).join('')||'—'}</div>
      <h3>${t('outstandingCustomers')}</h3>
      <div class="card">${outstandingCustomers.length? outstandingCustomers.map(x=>`<div class="row"><span class="k">${escapeHtml(x.c.name)}</span><span class="v" style="color:var(--danger)">${fmtMoney(x.bal)}</span></div>`).join(''): `<div style="font-size:13px;color:var(--text-muted)">—</div>`}</div>
      <h3>${t('routePerformance')}</h3>
      <div class="card">${routeArr.length? routeArr.map(([name,val])=>`<div class="barrow"><span class="name">${escapeHtml(name)}</span><div class="track"><div class="fill" style="width:${(val/maxRoute*100)}%"></div></div><span class="val">${fmtMoney(val)}</span></div>`).join(''):'—'}</div>
      <h3>${t('bestProducts')}</h3>
      <div class="card">${bestProducts.length? bestProducts.map(([name,val])=>`<div class="barrow"><span class="name">${escapeHtml(name)}</span><div class="track"><div class="fill" style="width:${(val/maxProd*100)}%;background:var(--accent)"></div></div><span class="val">${val}</span></div>`).join(''):'—'}</div>
    </div>
    ${bottomNav()}
  </div>`;
}

        <div class="settingItem" style="cursor:pointer" id="restoreBtn"><div class="si-icon">${icon('refresh')}</div><div class="si-txt"><div class="t1">${t('restoreBackup')}</div><div class="t2">${t('importData')}</div></div>${icon('chevron')}</div>
        <input type="file" id="restoreFile" accept="application/json" style="display:none;">
        <div class="settingItem" style="cursor:pointer" id="exportCsvBtn"><div class="si-icon">${icon('file')}</div><div class="si-txt"><div class="t1">${t('exportCsv')}</div></div>${icon('chevron')}</div>
        <div class="settingItem" style="cursor:pointer" id="exportExcelBtn"><div class="si-icon">${icon('file')}</div><div class="si-txt"><div class="t1">${t('exportExcel')}</div></div>${icon('chevron')}</div>
      </div>
      <h3 style="margin-top:16px;">${t('syncStatus')}</h3>
      <div class="card">
        <div class="settingItem"><div class="si-icon">${icon('refresh')}</div><div class="si-txt"><div class="t1" id="syncStatusText">${t('syncStatus')}</div><div class="t2" id="syncStatusSub">${navigator.onLine? t('online'): t('offline')}</div></div></div>
      </div>
      <p style="text-align:center;color:var(--text-muted);font-size:11.5px;margin-top:20px;">${t('version')}</p>
    </div>
    ${bottomNav()}
  </div>`;
}
function bindSettingsEvents(){
  document.getElementById('darkToggle')?.addEventListener('click',()=>{
    document.documentElement.classList.toggle('dark');
    localStorage.setItem('crm_theme', document.documentElement.classList.contains('dark')?'dark':'light');
    render();
  });
  root.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{ LANG=b.dataset.lang; localStorage.setItem('crm_lang',LANG); render(); });
  root.querySelectorAll('[data-edge]').forEach(b=>b.onclick=()=>{ applyRadiusPreset(b.dataset.edge); render(); toast(t('saved')); });
  document.getElementById('backupNowBtn')?.addEventListener('click',()=>{
    const blob=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='bakery-crm-backup-'+dateInputVal()+'.json'; a.click();
    toast(t('backedUp'));
  });
  document.getElementById('restoreBtn')?.addEventListener('click',()=>document.getElementById('restoreFile').click());
  document.getElementById('restoreFile')?.addEventListener('change',(e)=>{
    const file=e.target.files[0]; if(!file) return;
    const reader=new FileReader();
    reader.onload=()=>{ try{ const parsed=JSON.parse(reader.result); if(!parsed.customers) throw 0; DB=parsed; saveDB(); toast(t('restored')); go('home'); }catch(err){ toast(t('invalidFile')); } };
    reader.readAsText(file);
  });
  document.getElementById('exportCsvBtn')?.addEventListener('click',()=>exportCsv());
  document.getElementById('exportExcelBtn')?.addEventListener('click',()=>exportCsv(true));
}
function exportCsv(asExcel){
  const rows=[['Name','Shop','Mobile','Route','Status','Outstanding']];
  DB.customers.forEach(c=>rows.push([c.name,c.shopName,c.mobile,routeName(c.route),c.status,custBalance(c.id)]));
  const csv=rows.map(r=>r.map(v=>`"${(v+'').replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob=new Blob([csv],{type:'text/csv'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='customers.'+(asExcel?'xls':'csv'); a.click();
  toast(t('backedUp'));
}
function updateSyncIndicator(){
  const sub=document.getElementById('syncStatusSub');
  if(sub) sub.textContent = navigator.onLine? t('online'): t('offline');
}
window.addEventListener('online',updateSyncIndicator);
window.addEventListener('offline',updateSyncIndicator);

/* ============================================================
   14. GLOBAL EVENT BINDING
   ============================================================ */
function bindGlobalEvents(){
  bindNav();
  if(S.screen==='home') bindHomeEvents();
  if(S.screen==='profile') bindProfileEvents();
  if(S.screen==='settings') bindSettingsEvents();
}

/* ============================================================
   15. INIT
   ============================================================ */
(function init(){
  const theme=localStorage.getItem('crm_theme');
  if(theme==='dark') document.documentElement.classList.add('dark');
  else if(!theme && window.matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.classList.add('dark');
  applyRadiusPreset(localStorage.getItem('crm_radius')||'soft');
  render();
})();
</script>
</body>
